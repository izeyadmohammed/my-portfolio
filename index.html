<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
:root { --bg: #f7f7fb; --surface: #fff; --text: #14142b; --muted: #5b5b78; --line: #e4e4ef; --accent: #6d4aff; --accent2: #ff5fa2; }
[data-theme="dark"] { --bg: #0c0c18; --surface: #16162a; --text: #f2f2fb; --muted: #a3a3c2; --line: #2a2a45; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cairo', system-ui, sans-serif; line-height: 1.7; min-height: 100vh; transition: background 0.3s, color 0.3s; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tools { display: flex; gap: 8px; }
.btn { display: inline-block; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); transition: 0.2s; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: 0; padding: 14px 32px; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.hero { padding: 100px 0 80px; text-align: center; }
.hero .badge { display: inline-block; padding: 6px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.hero h1 { font-size: 60px; font-weight: 800; margin-bottom: 12px; line-height: 1.1; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .role { font-size: 24px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }
.hero .tag { color: var(--muted); max-width: 600px; margin: 0 auto 36px; font-size: 18px; }
section { padding: 80px 0; }
h2 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
h2::after { content: ''; display: block; width: 60px; height: 4px; border-radius: 4px; margin-top: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; transition: 0.2s; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 32px; }
.stat { text-align: center; }
.stat b { display: block; font-size: 36px; color: var(--accent); font-weight: 800; }
.stat small { color: var(--muted); font-size: 14px; }
.skill-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; }
.skill-bar { height: 10px; background: var(--bg); border-radius: 10px; overflow: hidden; }
.skill-bar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.cert { display: flex; gap: 20px; align-items: center; }
.cert-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
.social-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; justify-content: center; }
.social-icon { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-size: 22px; transition: 0.2s; color: var(--text); }
.social-icon:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
footer { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); margin-top: 80px; }
/* Responsive */
@media (min-width: 769px) {
  .desktop-nav { display: flex !important; }
  .mobile-menu-btn { display: none !important; }
  .sidebar { display: none !important; }
  .sidebar-overlay { display: none !important; }
}
@media (max-width: 768px) {
  .hero h1 { font-size: 40px; }
  .hero { padding: 60px 0 40px; }
  .desktop-nav { display: none !important; }
  .mobile-menu-btn { display: flex !important; }
  .sidebar { display: flex !important; }
}

/* Sidebar */
.sidebar {
  position: fixed; top: 0; right: -320px; width: 300px; height: 100vh;
  background: var(--surface); border-left: 1px solid var(--line);
  z-index: 1000; transition: right 0.3s ease;
  padding: 30px 20px; display: flex; flex-direction: column;
  box-shadow: -10px 0 30px rgba(0,0,0,0.1);
}
@media (min-width: 769px) {
  .sidebar { display: none !important; }
}
.sidebar.open { right: 0; }
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 999; opacity: 0; visibility: hidden; transition: 0.3s;
}
.sidebar-overlay.open { opacity: 1; visibility: visible; }
.sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  color: var(--muted); text-decoration: none;
  font-weight: 600; transition: 0.2s;
}
.sidebar-nav a:hover { background: var(--bg); color: var(--accent); transform: translateX(-5px); }
.sidebar-nav a i { width: 20px; text-align: center; font-size: 16px; }

/* Hamburger Animation */
.mobile-menu-btn.active .hamburger-line:nth-child(1) {
  transform: rotate(45deg);
  top: 19px !important;
}
.mobile-menu-btn.active .hamburger-line:nth-child(2) {
  opacity: 0;
}
.mobile-menu-btn.active .hamburger-line:nth-child(3) {
  transform: rotate(-45deg);
  top: 19px !important;
}

/* Scroll Animations */
.reveal {
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}
.reveal.active {
  opacity: 1;
  transform: translateY(0);
}
.reveal-left {
  opacity: 0;
  transform: translateX(-50px);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}
.reveal-left.active {
  opacity: 1;
  transform: translateX(0);
}
.reveal-right {
  opacity: 0;
  transform: translateX(50px);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}
.reveal-right.active {
  opacity: 1;
  transform: translateX(0);
}
.reveal-scale {
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}
.reveal-scale.active {
  opacity: 1;
  transform: scale(1);
}

/* Smooth Scroll */
html { scroll-behavior: smooth; }

/* Card Hover Enhancements */
.card {
  transition: all 0.4s cubic-bezier(0.5, 0, 0, 1);
  will-change: transform, box-shadow;
}
.card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 25px 50px rgba(109,74,255,0.2);
}

/* Section Headers Animation */
h2 {
  position: relative;
  display: inline-block;
}

/* Progress Bar Animation */
@keyframes fillBar {
  from { width: 0; }
}
.skill-bar i {
  animation: fillBar 1.5s ease-out;
}

/* Social Icons Stagger */
.social-icon {
  transition: all 0.4s cubic-bezier(0.5, 0, 0, 1);
}
.social-icon:hover {
  transform: translateY(-8px) rotate(8deg) scale(1.1);
  box-shadow: 0 15px 30px rgba(109,74,255,0.3);
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
.anim-hero { animation: fadeInUp 0.8s ease-out; }
.anim-card { animation: fadeInUp 0.6s ease-out backwards; }
.anim-social { animation: scaleIn 0.4s ease-out backwards; }
.card { transition: all 0.3s ease; }
.card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(109,74,255,0.15); }
.social-icon:hover { transform: translateY(-5px) rotate(5deg); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(109,74,255,0.2); }
.hero-avatar { animation: scaleIn 1s ease-out; }
h2 { animation: fadeInUp 0.5s ease-out; }

/* Admin */
#adminPanel { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; overflow-y: auto; padding: 20px; }
#adminPanel.on { display: block; }
.admin-content { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: 20px; border: 1px solid var(--line); }
.admin-content h2 { margin-bottom: 20px; }
.admin-content label { display: block; margin-top: 15px; font-weight: 600; color: var(--muted); font-size: 14px; }
.admin-content input, .admin-content textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; }
.admin-close { float: left; cursor: pointer; color: red; font-weight: 700; font-size: 20px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- لوحة التحكم -->
<div id="adminPanel">
  <div class="admin-content">
    <span class="admin-close" onclick="closeAdmin()">✖ إغلاق</span>
    <h2>لوحة التحكم</h2>
    <label>الاسم (عربي)</label><input id="a-name-ar">
    <label>الاسم (إنجليزي)</label><input id="a-name-en">
    <label>المسمى الوظيفي (عربي)</label><input id="a-role-ar">
    <label>المسمى الوظيفي (إنجليزي)</label><input id="a-role-en">
    <label>نبذة (عربي)</label><textarea id="a-tag-ar" rows="2"></textarea>
    <label>نبذة (إنجليزي)</label><textarea id="a-tag-en" rows="2"></textarea>
    <label>نبذة "عني" (عربي)</label><textarea id="a-about-ar" rows="2"></textarea>
    <label>نبذة "عني" (إنجليزي)</label><textarea id="a-about-en" rows="2"></textarea>
    <label>رابط صورتك</label><input id="a-image">
    <label>أو ارفع صورة من جهازك</label><input type="file" id="a-image-upload" accept="image/*">
    <div id="img-preview" style="margin-top:10px"></div>
    <label>سنين الخبرة</label><input id="a-exp" type="number">
    <label>عدد المشاريع</label><input id="a-proj" type="number">
    <label>عدد العملاء</label><input id="a-clients" type="number">
    <label>الإيميل</label><input id="a-email">
    <label>رقم الهاتف</label><input id="a-phone">
    
    <hr style="margin:20px 0;border-color:var(--line)">
    <h3>السوشيال ميديا (ضع علامة صح عشان تظهر)</h3>
    <label><input type="checkbox" id="a-show-facebook" style="width:auto"> فيسبوك</label><input id="a-facebook" placeholder="https://facebook.com/...">
    <label><input type="checkbox" id="a-show-whatsapp" style="width:auto"> واتساب</label><input id="a-whatsapp" placeholder="https://wa.me/...">
    <label><input type="checkbox" id="a-show-telegram" style="width:auto"> تليجرام</label><input id="a-telegram">
    <label><input type="checkbox" id="a-show-instagram" style="width:auto"> إنستجرام</label><input id="a-instagram">
    <label><input type="checkbox" id="a-show-tiktok" style="width:auto"> تيك توك</label><input id="a-tiktok">
    <label><input type="checkbox" id="a-show-github" style="width:auto"> جيت هاب</label><input id="a-github">
    <label><input type="checkbox" id="a-show-linkedin" style="width:auto"> لينكد إن</label><input id="a-linkedin">
    
    <label>نسبة مهارة 1</label><input id="a-skill1" type="number">
    <label>نسبة مهارة 2</label><input id="a-skill2" type="number">
    <label>نسبة مهارة 3</label><input id="a-skill3" type="number">
    <label>نسبة مهارة 4</label><input id="a-skill4" type="number">

    <hr style="margin:20px 0;border-color:var(--line)">
    <h3>المشاريع</h3>
    <div id="admin-projects-list"></div>
    <button class="btn" style="margin-top:10px" onclick="addProject()">+ إضافة مشروع</button>

    <hr style="margin:20px 0;border-color:var(--line)">
    <h3>الشهادات</h3>
    <div id="admin-certs-list"></div>
    <button class="btn" style="margin-top:10px" onclick="addCert()">+ إضافة شهادة</button>
    
    <button class="btn primary" style="margin-top:20px;width:100%" onclick="saveData()">💾 حفظ التغييرات</button>
  </div>
</div>

<script>
var T = {
  ar: { about: "عني", skills: "المهارات", certs: "الشهادات", projectsTitle: "المشاريع", contact: "تواصل معي", years: "سنين خبرة", projects: "مشروع", clients: "عميل سعيد", rights: "جميع الحقوق محفوظة", avail: "متاح للعمل الحر", hiring: "تواصل معي", aboutText: "مطوّر شغوف ببناء المنصات التعليمية وتجارب المستخدم المبتكرة." },
  en: { about: "About", skills: "Skills", certs: "Certificates", projectsTitle: "Projects", contact: "Contact Me", years: "Years Exp", projects: "Projects", clients: "Happy Clients", rights: "All rights reserved", avail: "Available for freelance", hiring: "Contact Me", aboutText: "A passionate developer building educational platforms and innovative user experiences." }
};

var defaultData = {
  nameAr: "محمد حسن", nameEn: "Mohamed Hassan",
  roleAr: "مطور ويب متكامل", roleEn: "Full-Stack Developer",
  tagAr: "بصمّم وببني منتجات رقمية سريعة وجميلة ومفيدة، ومؤسس منصة شرحتهالك التعليمية.",
  tagEn: "I build fast, beautiful digital products. Founder of Sharahthalk platform.",
  aboutAr: "مطوّر شغوف ببناء المنصات التعليمية وتجارب المستخدم المبتكرة.",
  aboutEn: "A passionate developer building educational platforms and innovative user experiences.",
  image: "", email: "hello@example.com", phone: "+201000000000",
  exp: 5, proj: 40, clients: 25,
  socials: { facebook: "", whatsapp: "", telegram: "", instagram: "", tiktok: "", github: "", linkedin: "" },
  show: { facebook: true, whatsapp: true, telegram: false, instagram: false, tiktok: false, github: true, linkedin: false },
  skills: [92, 88, 82, 78],
  certificates: [{ title: "Meta Front-End Developer", issuer: "Coursera", year: "2022", img: "" }],
  projects: [
    { title: "منصة شرحتهالك", desc: "منصة تعليمية متكاملة (LMS) تدعم المدرسين والطلاب، مع نظام امتحانات ومحفظة إلكترونية.", img: "", link: "https://sharh.hostless.site" }
  ]
};

var D = JSON.parse(localStorage.getItem('portfolioData')) || defaultData;
if (!D.socials) D.socials = defaultData.socials;
if (!D.show) D.show = defaultData.show;

function render() {
  var isAr = document.documentElement.lang === 'ar';
  var L = T[isAr ? 'ar' : 'en'];
  var name = isAr ? D.nameAr : D.nameEn;
  document.getElementById('page-title').textContent = name;
  
  // تشخيص: نتأكد إن الصورة موجودة
  console.log('=== تشخيص ===');
  console.log('الصورة:', D.image ? 'موجودة (طولها: ' + D.image.length + ' حرف)' : 'مش موجودة');
  console.log('الاسم:', name);
  
  // الأيقونات
  var socialIcons = [
    { key: 'facebook', icon: 'fa-facebook', prefix: 'fa-brands', color: '#1877f2' },
    { key: 'whatsapp', icon: 'fa-whatsapp', prefix: 'fa-brands', color: '#25d366' },
    { key: 'telegram', icon: 'fa-telegram', prefix: 'fa-brands', color: '#0088cc' },
    { key: 'instagram', icon: 'fa-instagram', prefix: 'fa-brands', color: '#e4405f' },
    { key: 'tiktok', icon: 'fa-tiktok', prefix: 'fa-brands', color: '#000' },
    { key: 'github', icon: 'fa-github', prefix: 'fa-brands', color: '#333' },
    { key: 'linkedin', icon: 'fa-linkedin', prefix: 'fa-brands', color: '#0077b5' }
  ];
  
  var activeSocials = socialIcons.filter(s => D.show[s.key] && D.socials[s.key]).map(s => 
    `<a href="${D.socials[s.key]}" target="_blank" class="social-icon" style="color:${s.color}"><i class="${s.prefix} ${s.icon}"></i></a>`
  ).join('');

  var html = `
    <header>
      <div class="wrap">
        <div class="logo">${name}</div>
        <div class="desktop-nav" style="display:none;gap:24px;align-items:center">
          <a href="#about" style="font-size:14px;font-weight:600;color:var(--muted);transition:0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">${L.about}</a>
          <a href="#skills" style="font-size:14px;font-weight:600;color:var(--muted);transition:0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">${L.skills}</a>
          <a href="#projects" style="font-size:14px;font-weight:600;color:var(--muted);transition:0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">${L.projectsTitle || 'المشاريع'}</a>
          <a href="#certificates" style="font-size:14px;font-weight:600;color:var(--muted);transition:0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">${L.certs}</a>
          <a href="#contact" style="font-size:14px;font-weight:600;color:var(--muted);transition:0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">${L.contact}</a>
        </div>
        <div class="tools">
          <button class="btn small" onclick="toggleLang()">${isAr ? 'EN' : 'ع'}</button>
          <button class="btn small" onclick="toggleTheme()">🌓</button>
          <button class="btn small mobile-menu-btn" id="menuBtn" onclick="toggleSidebar()" style="display:none; position:relative; width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center;">
            <span class="hamburger-line" style="position:absolute; width:20px; height:2px; background:var(--text); transition:0.3s; top:12px"></span>
            <span class="hamburger-line" style="position:absolute; width:20px; height:2px; background:var(--text); transition:0.3s; top:19px"></span>
            <span class="hamburger-line" style="position:absolute; width:20px; height:2px; background:var(--text); transition:0.3s; top:26px"></span>
          </button>
        </div>
      </div>
    </header>
    <!-- Sidebar -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside id="sidebar" class="sidebar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
        <div class="logo" style="font-size:20px">${name}</div>
        <button onclick="toggleSidebar()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="#about" onclick="toggleSidebar()"><i class="fa-solid fa-user"></i> ${L.about}</a>
        <a href="#skills" onclick="toggleSidebar()"><i class="fa-solid fa-code"></i> ${L.skills}</a>
        <a href="#projects" onclick="toggleSidebar()"><i class="fa-solid fa-rocket"></i> ${L.projectsTitle || 'المشاريع'}</a>
        <a href="#certificates" onclick="toggleSidebar()"><i class="fa-solid fa-certificate"></i> ${L.certs}</a>
        <a href="#contact" onclick="toggleSidebar()"><i class="fa-solid fa-envelope"></i> ${L.contact}</a>
      </nav>
      <div style="margin-top:auto;padding-top:30px;border-top:1px solid var(--line)">
        <p style="font-size:13px;color:var(--muted);text-align:center">© 2024 ${name}</p>
      </div>
    </aside>
    <main>
      <section class="hero anim-hero">
        <div class="wrap">
          <div style="display:flex;justify-content:center;margin-bottom:30px">
            ${D.image ? `<img src="${D.image}" style="width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);box-shadow:0 10px 30px rgba(109,74,255,0.2)">` : `<div style="width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:70px;font-weight:800">${name.charAt(0)}</div>`}
          </div>
          <div class="badge">● ${L.avail}</div>
          <h1><span>${name}</span></h1>
          <div class="role">${isAr ? D.roleAr : D.roleEn}</div>
          <p class="tag">${isAr ? D.tagAr : D.tagEn}</p>
        </div>
      </section>
      
      <section id="about" class="reveal">
        <div class="wrap" style="text-align:center">
          <h2>${L.about}</h2>
          <p style="color:var(--muted);max-width:700px;margin:20px auto;font-size:18px">${isAr ? D.aboutAr : D.aboutEn}</p>
          <div class="stats">
            <div class="card stat anim-card"><b>${D.exp}+</b><small>${L.years}</small></div>
            <div class="card stat anim-card"><b>${D.proj}+</b><small>${L.projects}</small></div>
            <div class="card stat anim-card"><b>${D.clients}+</b><small>${L.clients}</small></div>
          </div>
        </div>
      </section>

      <section id="skills" class="reveal" style="background:var(--surface)">
        <div class="wrap">
          <h2>${L.skills}</h2>
          <div class="grid">
            ${['JavaScript', 'React', 'Node.js', 'UI/UX'].map((s, i) => `
              <div class="card reveal"><div class="skill-row"><span>${s}</span><span>${D.skills[i]}%</span></div><div class="skill-bar"><i style="width:${D.skills[i]}%"></i></div></div>
            `).join('')}
          </div>
        </div>
      </section>

      <section id="certificates" class="reveal">
        <div class="wrap">
          <h2>${L.certs}</h2>
          <div class="grid">
            ${(D.certificates || []).map(c => `
              <div class="card reveal">
                ${c.img ? `<img src="${c.img}" class="cert-img">` : ''}
                <b>${c.title}</b><br><small style="color:var(--muted)">${c.issuer} · ${c.year}</small>
              </div>
            `).join('')}
          </div>
        </div>
      </section>

      <section id="projects" class="reveal">
        <div class="wrap">
          <h2>المشاريع</h2>
          <div class="grid">
            ${(D.projects || []).map(p => `
              <div class="card reveal">
                ${p.img ? `<img src="${p.img}" style="width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:16px">` : ''}
                <h3 style="font-size:20px;margin-bottom:8px">${p.title}</h3>
                <p style="color:var(--muted);font-size:15px;margin-bottom:16px">${p.desc}</p>
                ${p.link ? `<a href="${p.link}" target="_blank" class="btn primary" style="padding:8px 20px;font-size:14px">عرض المشروع</a>` : ''}
              </div>
            `).join('') || '<p style="color:var(--muted)">لا توجد مشاريع بعد</p>'}
          </div>
        </div>
      </section>

      <section id="contact" class="reveal">
        <div class="wrap" style="text-align:center">
          <h2>${L.contact}</h2>
          <div style="margin-top:30px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap">
            <a href="mailto:${D.email}" class="btn primary"><i class="fa-solid fa-envelope"></i> ${D.email}</a>
            <a href="tel:${D.phone}" class="btn"><i class="fa-solid fa-phone"></i> ${D.phone}</a>
          </div>
          <div class="social-btns">${activeSocials}</div>
        </div>
      </section>
    </main>
    <footer onclick="handleFooterClick()"><div class="wrap">© 2024 ${name} · ${L.rights}</div></footer>
  `;
  document.getElementById('app').innerHTML = html;
  applyTheme();
}

function toggleLang() {
  document.documentElement.lang = document.documentElement.lang === 'ar' ? 'en' : 'ar';
  document.documentElement.dir = document.documentElement.lang === 'ar' ? 'rtl' : 'ltr';
  render();
}

function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
  else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var menuBtn = document.getElementById('menuBtn');
  if (!sidebar) return;
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
  if (menuBtn) menuBtn.classList.toggle('active');
}

function applyTheme() {
  if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}

// Admin
var taps = 0, tapTimer;
function handleFooterClick() {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 1000);
  if (taps >= 5) { taps = 0; openAdmin(); }
}

function openAdmin() {
  var p = prompt("أدخل كلمة سر الأدمن:", "admin123");
  if (p !== "admin123") return;
  document.getElementById('adminPanel').classList.add('on');
  
  var fields = {
    'a-name-ar': D.nameAr, 'a-name-en': D.nameEn,
    'a-role-ar': D.roleAr, 'a-role-en': D.roleEn,
    'a-tag-ar': D.tagAr, 'a-tag-en': D.tagEn,
    'a-about-ar': D.aboutAr, 'a-about-en': D.aboutEn,
    'a-image': D.image, 'a-exp': D.exp, 'a-proj': D.proj, 'a-clients': D.clients,
    'a-email': D.email, 'a-phone': D.phone,
    'a-facebook': D.socials.facebook || '', 'a-whatsapp': D.socials.whatsapp || '',
    'a-telegram': D.socials.telegram || '', 'a-instagram': D.socials.instagram || '',
    'a-tiktok': D.socials.tiktok || '', 'a-github': D.socials.github || '', 'a-linkedin': D.socials.linkedin || '',
    'a-skill1': D.skills[0], 'a-skill2': D.skills[1], 'a-skill3': D.skills[2], 'a-skill4': D.skills[3]
  };
  for (var id in fields) document.getElementById(id).value = fields[id];
  
  for (var k in D.show) document.getElementById('a-show-' + k).checked = D.show[k];
  
  document.getElementById('a-image-upload').onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert('الصورة كبيرة أوي، اختار صورة أقل من 2 ميجا');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) { 
      D.image = ev.target.result; 
      console.log('تم رفع الصورة، طولها:', D.image.length);
      alert('تم رفع الصورة بنجاح! اضغط حفظ عشان تظهر');
    };
    reader.readAsDataURL(file);
  };
  
  renderAdminProjects();
  renderAdminCerts();
}

function closeAdmin() { document.getElementById('adminPanel').classList.remove('on'); }

function saveData() {
  D.nameAr = document.getElementById('a-name-ar').value;
  D.nameEn = document.getElementById('a-name-en').value;
  D.roleAr = document.getElementById('a-role-ar').value;
  D.roleEn = document.getElementById('a-role-en').value;
  D.tagAr = document.getElementById('a-tag-ar').value;
  D.tagEn = document.getElementById('a-tag-en').value;
  D.aboutAr = document.getElementById('a-about-ar').value;
  D.aboutEn = document.getElementById('a-about-en').value;
  var imgValue = document.getElementById('a-image').value;
  D.image = imgValue || D.image; // لو المستخدم كتب لينك، نستخدمه، لو سابه فاضي، نحتفظ بالصورة المرفوعة
  D.exp = +document.getElementById('a-exp').value;
  D.proj = +document.getElementById('a-proj').value;
  D.clients = +document.getElementById('a-clients').value;
  D.email = document.getElementById('a-email').value;
  D.phone = document.getElementById('a-phone').value;
  
  D.socials = {
    facebook: document.getElementById('a-facebook').value,
    whatsapp: document.getElementById('a-whatsapp').value,
    telegram: document.getElementById('a-telegram').value,
    instagram: document.getElementById('a-instagram').value,
    tiktok: document.getElementById('a-tiktok').value,
    github: document.getElementById('a-github').value,
    linkedin: document.getElementById('a-linkedin').value
  };
  
  D.show = {
    facebook: document.getElementById('a-show-facebook').checked,
    whatsapp: document.getElementById('a-show-whatsapp').checked,
    telegram: document.getElementById('a-show-telegram').checked,
    instagram: document.getElementById('a-show-instagram').checked,
    tiktok: document.getElementById('a-show-tiktok').checked,
    github: document.getElementById('a-show-github').checked,
    linkedin: document.getElementById('a-show-linkedin').checked
  };
  
  D.skills = [
    +document.getElementById('a-skill1').value,
    +document.getElementById('a-skill2').value,
    +document.getElementById('a-skill3').value,
    +document.getElementById('a-skill4').value
  ];
  
  // حفظ المشاريع مع البيانات
  if (D.projects) {
    console.log('عدد المشاريع قبل الحفظ:', D.projects.length);
  }
  localStorage.setItem('portfolioData', JSON.stringify(D));
  closeAdmin(); render(); alert('✅ تم الحفظ!');
}

function renderAdminProjects() {
  var box = document.getElementById('admin-projects-list');
  if (!D.projects) D.projects = [];
  box.innerHTML = D.projects.map((p, i) => `
    <div style="border:1px solid var(--line);padding:15px;border-radius:12px;margin-top:10px">
      <input placeholder="عنوان المشروع" value="${p.title||''}" oninput="D.projects[${i}].title=this.value" style="margin-bottom:8px">
      <textarea placeholder="وصف المشروع" oninput="D.projects[${i}].desc=this.value" style="margin-bottom:8px" rows="2">${p.desc||''}</textarea>
      <input placeholder="لينك المشروع" value="${p.link||''}" oninput="D.projects[${i}].link=this.value" style="margin-bottom:8px">
      <input placeholder="لينك صورة (اختياري)" value="${p.img||''}" oninput="D.projects[${i}].img=this.value" style="margin-bottom:8px">
      <input type="file" accept="image/*" onchange="uploadProject(event,${i})" style="margin-bottom:8px">
      ${p.img ? `<img src="${p.img}" style="width:100%;height:100px;object-fit:cover;border-radius:8px">` : ''}
      <button class="btn" onclick="D.projects.splice(${i},1);renderAdminProjects()" style="color:red;margin-top:8px">حذف</button>
    </div>
  `).join('');
}

function addProject() {
  if (!D.projects) D.projects = [];
  D.projects.push({title:'',desc:'',link:'',img:''});
  renderAdminProjects();
}

function uploadProject(e, i) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) { D.projects[i].img = ev.target.result; renderAdminProjects(); };
  r.readAsDataURL(f);
}

function renderAdminCerts() {
  var box = document.getElementById('admin-certs-list');
  if (!D.certificates) D.certificates = [];
  box.innerHTML = D.certificates.map((c, i) => `
    <div style="border:1px solid var(--line);padding:15px;border-radius:12px;margin-top:10px">
      <input placeholder="العنوان" value="${c.title||''}" oninput="D.certificates[${i}].title=this.value" style="margin-bottom:8px">
      <input placeholder="الجهة" value="${c.issuer||''}" oninput="D.certificates[${i}].issuer=this.value" style="margin-bottom:8px">
      <input placeholder="السنة" value="${c.year||''}" oninput="D.certificates[${i}].year=this.value" style="margin-bottom:8px">
      <input placeholder="لينك صورة (اختياري)" value="${c.img||''}" oninput="D.certificates[${i}].img=this.value" style="margin-bottom:8px">
      <input type="file" accept="image/*,application/pdf" onchange="uploadCert(event,${i})" style="margin-bottom:8px">
      ${c.img ? `<img src="${c.img}" style="width:100%;height:80px;object-fit:cover;border-radius:8px">` : ''}
      <button class="btn" onclick="D.certificates.splice(${i},1);renderAdminCerts()" style="color:red;margin-top:8px">حذف</button>
    </div>
  `).join('');
}

function addCert() {
  if (!D.certificates) D.certificates = [];
  D.certificates.push({title:'',issuer:'',year:'',img:''});
  renderAdminProjects();
  renderAdminCerts();
}

function uploadCert(e, i) {
  var f = e.target.files[0];
  if (!f) return;
  
  if (f.type === 'application/pdf') {
    // لو ملف PDF، نحوله لصورة
    var reader = new FileReader();
    reader.onload = async function(ev) {
      try {
        var pdf = await pdfjsLib.getDocument({ data: ev.target.result }).promise;
        var page = await pdf.getPage(1);
        var viewport = page.getViewport({ scale: 2.0 });
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        D.certificates[i].img = canvas.toDataURL('image/jpeg', 0.9);
        renderAdminCerts();
      } catch (err) {
        alert('خطأ في قراءة PDF: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(f);
  } else {
    // لو صورة عادية
    var r = new FileReader();
    r.onload = function(ev) { D.certificates[i].img = ev.target.result; renderAdminCerts(); };
    r.readAsDataURL(f);
  }
}

// Scroll Animations (Intersection Observer)
function initScrollAnimations() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('active');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
  
  document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => {
    observer.observe(el);
  });
}

// بعد كل render، نعيد تشغيل الأنميشن
const originalRender = render;
render = function() {
  originalRender();
  setTimeout(initScrollAnimations, 100);
};

render();
</script>
