<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeyad Mohamed | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<style>
:root { --bg: #f7f7fb; --surface: #fff; --text: #14142b; --muted: #5b5b78; --line: #e4e4ef; --accent: #6d4aff; --accent2: #ff5fa2; }
[data-theme="dark"] { --bg: #0c0c18; --surface: #16162a; --text: #f2f2fb; --muted: #a3a3c2; --line: #2a2a45; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cairo', system-ui, sans-serif; line-height: 1.7; min-height: 100vh; transition: 0.3s; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
nav { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
nav a:hover { color: var(--text); }
.tools { display: flex; gap: 8px; }
.btn { display: inline-block; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); transition: 0.2s; }
.btn:hover { border-color: var(--accent); transform: translateY(-2px); }
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: 0; padding: 14px 32px; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.hero { padding: 100px 0 80px; text-align: center; animation: fadeInUp 0.8s; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.hero .badge { display: inline-block; padding: 6px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.hero h1 { font-size: 60px; font-weight: 800; margin-bottom: 12px; line-height: 1.1; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .role { font-size: 24px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }
.hero .tag { color: var(--muted); max-width: 600px; margin: 0 auto 36px; font-size: 18px; }
.hero-avatar { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 30px; object-fit: cover; border: 4px solid var(--surface); box-shadow: 0 10px 30px rgba(109,74,255,0.2); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 70px; font-weight: 800; animation: scaleIn 1s; }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
section { padding: 80px 0; }
h2 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
h2::after { content: ''; display: block; width: 60px; height: 4px; border-radius: 4px; margin-top: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; transition: 0.4s; }
.card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(109,74,255,0.15); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 32px; }
.stat { text-align: center; }
.stat b { display: block; font-size: 36px; color: var(--accent); font-weight: 800; }
.stat small { color: var(--muted); font-size: 14px; }
.skill-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; }
.skill-bar { height: 10px; background: var(--bg); border-radius: 10px; overflow: hidden; }
.skill-bar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: fillBar 1.5s; }
@keyframes fillBar { from { width: 0; } }
.cert { display: flex; gap: 20px; align-items: center; }
.cert-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
.social-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; justify-content: center; }
.social-icon { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-size: 22px; transition: 0.2s; color: var(--text); }
.social-icon:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-5px); }
footer { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); margin-top: 80px; }
@media (max-width: 768px) { .hero h1 { font-size: 40px; } .hero { padding: 60px 0 40px; } nav { display: none; } }
#adminPanel { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; overflow-y: auto; padding: 20px; }
#adminPanel.on { display: block; }
.admin-content { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: 20px; border: 1px solid var(--line); }
.admin-content label { display: block; margin-top: 15px; font-weight: 600; color: var(--muted); font-size: 14px; }
.admin-content input, .admin-content textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; }
</style>
</head>
<body>
<div id="app"></div>

<div id="adminPanel">
  <div class="admin-content">
    <span style="float:left;cursor:pointer;color:red;font-weight:700;font-size:20px" onclick="closeAdmin()">✖</span>
    <h2>لوحة التحكم</h2>
    <label>الاسم (عربي)</label><input id="a-name-ar">
    <label>الاسم (إنجليزي)</label><input id="a-name-en">
    <label>المسمى (عربي)</label><input id="a-role-ar">
    <label>المسمى (إنجليزي)</label><input id="a-role-en">
    <label>نبذة (عربي)</label><textarea id="a-tag-ar"></textarea>
    <label>نبذة (إنجليزي)</label><textarea id="a-tag-en"></textarea>
    <label>رابط الصورة</label><input id="a-image">
    <label>الإيميل</label><input id="a-email">
    <label>الهاتف</label><input id="a-phone">
    <label>واتساب</label><input id="a-whatsapp">
    <label>جيت هاب</label><input id="a-github">
    <label>لينكد إن</label><input id="a-linkedin">
    <button class="btn primary" style="margin-top:20px;width:100%" onclick="saveData()">💾 حفظ</button>
  </div>
</div>

<script>
var D = JSON.parse(localStorage.getItem('portfolioData')) || {
  nameAr: "زياد محمد", nameEn: "Zeyad Mohamed",
  roleAr: "مطور ويب متكامل", roleEn: "Full-Stack Developer",
  tagAr: "مطوّر ويب متكامل، ومؤسس منصة شرحتهالك التعليمية.",
  tagEn: "Full-Stack Developer and Founder of Sharahthalk platform.",
  image: "", email: "number9138@gmail.com", phone: "01126346329",
  whatsapp: "https://wa.me/201126346329", github: "https://github.com/izeyadmohammed", linkedin: "",
  skills: [{n:"JavaScript", v:85}, {n:"HTML & CSS", v:95}, {n:"Supabase / SQL", v:80}, {n:"UI/UX Design", v:75}],
  projects: [{title:"منصة شرحتهالك", desc:"منصة تعليمية متكاملة (LMS) تدعم المدرسين والطلاب، مع نظام امتحانات محمي ومحفظة إلكترونية.", link:"https://sharh.hostless.site", img:""}],
  certs: [
  {title:"JavaScript Level 1 - TOFAS", issuer:"SPRIX / Hiroshima University", year:"2026", img:"images/certificate_0019c865e76c0bbce56f7c63489449985.pdf"},
  {title:"JavaScript Level 2 - TOFAS", issuer:"SPRIX / Hiroshima University", year:"2026", img:"images/certificate_0019f1439935e43d5207ebbf69d68faaf.pdf"},
  {title:"JavaScript Level 3 - TOFAS", issuer:"SPRIX / Hiroshima University", year:"2026", img:"images/certificate_0019fb29ada6c37551101d2c21fdf7eba.pdf"}
]
};

function render() {
  var isAr = document.documentElement.lang === 'ar';
  var name = isAr ? D.nameAr : D.nameEn;
  var role = isAr ? D.roleAr : D.roleEn;
  var tag = isAr ? D.tagAr : D.tagEn;

  document.getElementById('app').innerHTML = `
    <header><div class="wrap">
      <div class="logo">${name}</div>
      <nav>
        <a href="#about">${isAr?'عني':'About'}</a>
        <a href="#skills">${isAr?'المهارات':'Skills'}</a>
        <a href="#projects">${isAr?'المشاريع':'Projects'}</a>
        <a href="#certs">${isAr?'الشهادات':'Certificates'}</a>
        <a href="#contact">${isAr?'تواصل':'Contact'}</a>
      </nav>
      <div class="tools">
        <button class="btn small" onclick="toggleLang()">${isAr?'EN':'ع'}</button>
        <button class="btn small" onclick="toggleTheme()">🌓</button>
      </div>
    </div></header>
    <main>
      <section class="hero"><div class="wrap">
        ${D.image ? `<img src="${D.image}" class="hero-avatar">` : `<div class="hero-avatar">${name.charAt(0)}</div>`}
        <div class="badge">● ${isAr?'متاح للعمل الحر':'Available for freelance'}</div>
        <h1><span>${name}</span></h1>
        <div class="role">${role}</div>
        <p class="tag">${tag}</p>
        <a href="#contact" class="btn primary">${isAr?'تواصل معي':'Contact Me'}</a>
      </div></section>

      <section id="about"><div class="wrap" style="text-align:center">
        <h2>${isAr?'عني':'About'}</h2>
        <p style="color:var(--muted);max-width:700px;margin:20px auto;font-size:18px">${tag}</p>
        <div class="stats">
          <div class="card stat"><b>1+</b><small>${isAr?'سنة خبرة':'Years exp'}</small></div>
          <div class="card stat"><b>1</b><small>${isAr?'مشروع':'Project'}</small></div>
          <div class="card stat"><b>∞</b><small>${isAr?'شغف':'Passion'}</small></div>
        </div>
      </div></section>

      <section id="skills" style="background:var(--surface)"><div class="wrap">
        <h2>${isAr?'المهارات':'Skills'}</h2>
        <div class="grid">${D.skills.map(s => `<div class="card"><div class="skill-row"><span>${s.n}</span><span>${s.v}%</span></div><div class="skill-bar"><i style="width:${s.v}%"></i></div></div>`).join('')}</div>
      </div></section>

      <section id="projects"><div class="wrap">
        <h2>${isAr?'المشاريع':'Projects'}</h2>
        <div class="grid">${D.projects.map(p => `
          <div class="card">
            ${p.img?`<img src="${p.img}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px">`:''}
            <h3 style="font-size:20px;margin-bottom:8px">${p.title}</h3>
            <p style="color:var(--muted);margin-bottom:16px">${p.desc}</p>
            <a href="${p.link}" target="_blank" class="btn primary" style="padding:8px 20px;font-size:14px">${isAr?'عرض المشروع':'View Project'}</a>
          </div>`).join('')}
        </div>
      </div></section>

      <section id="certs" style="background:var(--surface)"><div class="wrap">
        <h2>${isAr?'الشهادات':'Certificates'}</h2>
        <div class="grid">${D.certs.map(c => {
          const isPdf = c.img && c.img.toLowerCase().endsWith('.pdf');
          return `
            <div class="card cert">
              ${c.img ? (isPdf 
                ? `<a href="${c.img}" target="_blank" style="display:block;margin-bottom:12px"><iframe src="${c.img}" style="width:100%;height:180px;border:1px solid var(--line);border-radius:12px;pointer-events:none"></iframe></a>`
                : `<img src="${c.img}" class="cert-img">`) : ''}
              <div><b>${c.title}</b><br><small style="color:var(--muted)">${c.issuer} · ${c.year}</small></div>
              ${isPdf ? `<a href="${c.img}" target="_blank" class="btn" style="margin-top:8px;padding:6px 14px;font-size:12px">عرض الشهادة</a>` : ''}
            </div>`;
        }).join('')}
        </div>
      </div></section>

      <section id="contact"><div class="wrap" style="text-align:center">
        <h2>${isAr?'تواصل معي':'Contact Me'}</h2>
        <div class="social-btns">
          <a href="mailto:${D.email}" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
          <a href="tel:${D.phone}" class="social-icon"><i class="fa-solid fa-phone"></i></a>
          ${D.whatsapp?`<a href="${D.whatsapp}" class="social-icon" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>`:''}
          ${D.github?`<a href="${D.github}" class="social-icon" target="_blank"><i class="fa-brands fa-github"></i></a>`:''}
          ${D.linkedin?`<a href="${D.linkedin}" class="social-icon" target="_blank"><i class="fa-brands fa-linkedin"></i></a>`:''}
        </div>
      </div></section>
    </main>
    <footer onclick="taps++">© 2024 ${name} · ${isAr?'جميع الحقوق محفوظة':'All rights reserved'}</footer>
  `;
}

function toggleLang() {
  document.documentElement.lang = document.documentElement.lang === 'ar' ? 'en' : 'ar';
  document.documentElement.dir = document.documentElement.lang === 'ar' ? 'rtl' : 'ltr';
  render();
}
function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
}
if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');

var taps = 0, tapTimer;
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'FOOTER' || e.target.closest('footer')) {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 1000);
    if (taps >= 5) { taps = 0; openAdmin(); }
  }
});

function openAdmin() {
  if (prompt('كلمة السر:') !== 'admin123') return;
  document.getElementById('adminPanel').classList.add('on');
  document.getElementById('a-name-ar').value = D.nameAr;
  document.getElementById('a-name-en').value = D.nameEn;
  document.getElementById('a-role-ar').value = D.roleAr;
  document.getElementById('a-role-en').value = D.roleEn;
  document.getElementById('a-tag-ar').value = D.tagAr;
  document.getElementById('a-tag-en').value = D.tagEn;
  document.getElementById('a-image').value = D.image;
  document.getElementById('a-email').value = D.email;
  document.getElementById('a-phone').value = D.phone;
  document.getElementById('a-whatsapp').value = D.whatsapp;
  document.getElementById('a-github').value = D.github;
  document.getElementById('a-linkedin').value = D.linkedin;
}

function closeAdmin() { document.getElementById('adminPanel').classList.remove('on'); }

function saveData() {
  D.nameAr = document.getElementById('a-name-ar').value;
  D.nameEn = document.getElementById('a-name-en').value;
  D.roleAr = document.getElementById('a-role-ar').value;
  D.roleEn = document.getElementById('a-role-en').value;
  D.tagAr = document.getElementById('a-tag-ar').value;
  D.tagEn = document.getElementById('a-tag-en').value;
  D.image = document.getElementById('a-image').value;
  D.email = document.getElementById('a-email').value;
  D.phone = document.getElementById('a-phone').value;
  D.whatsapp = document.getElementById('a-whatsapp').value;
  D.github = document.getElementById('a-github').value;
  D.linkedin = document.getElementById('a-linkedin').value;
  localStorage.setItem('portfolioData', JSON.stringify(D));
  closeAdmin();
  render();
  alert('✅ تم الحفظ!');
}

render();
</script>
</body>
</html>
