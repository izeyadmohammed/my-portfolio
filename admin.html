<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>إدارة البورتفوليو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Cairo', sans-serif; background: #0B1120; color: #f3f4f6; } </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">
  
  <div class="w-full max-w-3xl bg-white/5 border border-white/10 rounded-3xl p-8 shadow-2xl mt-10">
    <h1 class="text-3xl font-black mb-8 text-center text-blue-500">تعديل البورتفوليو (خاص)</h1>
    
    <div class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-400">الاسم</label>
          <input id="in-name" type="text" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-400">المسمى الوظيفي</label>
          <input id="in-title" type="text" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-1 text-gray-400">نبذة (Bio)</label>
        <textarea id="in-bio" rows="3" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500"></textarea>
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-1 text-gray-400">رابط الصورة (URL)</label>
        <input id="in-image" type="text" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500" dir="ltr">
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-1 text-gray-400">المهارات (افصل بفاصلة)</label>
        <input id="in-skills" type="text" placeholder="HTML, CSS, JS" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500" dir="ltr">
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-400">واتساب</label>
          <input id="in-wa" type="text" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500" dir="ltr">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-400">الإيميل</label>
          <input id="in-mail" type="email" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500" dir="ltr">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-400">GitHub</label>
          <input id="in-github" type="text" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500" dir="ltr">
        </div>
      </div>

      <div class="mt-8 border-t border-white/10 pt-5">
        <label class="block text-sm font-bold mb-2 text-blue-400">الشهادات (JSON)</label>
        <textarea id="in-certs" rows="4" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500 font-mono text-xs" dir="ltr"></textarea>
      </div>

      <div class="mt-4">
        <label class="block text-sm font-bold mb-2 text-blue-400">المشاريع (JSON)</label>
        <textarea id="in-projects" rows="5" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500 font-mono text-xs" dir="ltr"></textarea>
      </div>
      
      <button id="save-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition mt-6 text-lg shadow-lg shadow-blue-500/20">
        حفظ التغييرات
      </button>
    </div>
  </div>

  <script>
    const defaultData = {
      name: 'محمد', title: 'مطور برمجيات', bio: 'نبذة عنك...', image: 'https://ui-avatars.com/api/?name=M&background=3B82F6&color=fff&size=300',
      skills: ['HTML', 'CSS'], certs: [], projects: [], whatsapp: '', email: '', github: ''
    };

    let data = JSON.parse(localStorage.getItem('portfolio_data')) || defaultData;

    document.getElementById('in-name').value = data.name;
    document.getElementById('in-title').value = data.title;
    document.getElementById('in-bio').value = data.bio;
    document.getElementById('in-image').value = data.image;
    document.getElementById('in-skills').value = data.skills.join(', ');
    document.getElementById('in-wa').value = data.whatsapp;
    document.getElementById('in-mail').value = data.email;
    document.getElementById('in-github').value = data.github || '';
    document.getElementById('in-certs').value = JSON.stringify(data.certs || [], null, 2);
    document.getElementById('in-projects').value = JSON.stringify(data.projects || [], null, 2);

    document.getElementById('save-btn').onclick = () => {
      try {
        data.name = document.getElementById('in-name').value;
        data.title = document.getElementById('in-title').value;
        data.bio = document.getElementById('in-bio').value;
        data.image = document.getElementById('in-image').value;
        data.skills = document.getElementById('in-skills').value.split(',').map(s => s.trim()).filter(Boolean);
        data.whatsapp = document.getElementById('in-wa').value;
        data.email = document.getElementById('in-mail').value;
        data.github = document.getElementById('in-github').value;
        
        try { data.certs = JSON.parse(document.getElementById('in-certs').value); } catch(e) { alert('خطأ في صيغة الشهادات JSON'); return; }
        try { data.projects = JSON.parse(document.getElementById('in-projects').value); } catch(e) { alert('خطأ في صيغة المشاريع JSON'); return; }

        localStorage.setItem('portfolio_data', JSON.stringify(data));
        alert('تم الحفظ بنجاح!');
        location.reload();
      } catch(e) { alert('حدث خطأ: ' + e.message); }
    };
  </script>
</body>
</html>
