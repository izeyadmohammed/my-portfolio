<style>
:root { --bg: #f7f7fb; --surface: #fff; --text: #14142b; --muted: #5b5b78; --line: #e4e4ef; --accent: #6d4aff; --accent2: #ff5fa2; }
[data-theme="dark"] { --bg: #0c0c18; --surface: #16162a; --text: #f2f2fb; --muted: #a3a3c2; --line: #2a2a45; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cairo', system-ui, sans-serif; line-height: 1.7; min-height: 100vh; transition: 0.3s; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
nav { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
nav a:hover { color: var(--text); }
.tools { display: flex; gap: 8px; }
.btn { display: inline-block; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); transition: 0.2s; }
.btn:hover { border-color: var(--accent); transform: translateY(-2px); }
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: 0; padding: 14px 32px; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.hero { padding: 100px 0 80px; text-align: center; animation: fadeInUp 0.8s; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.hero .badge { display: inline-block; padding: 6px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.hero h1 { font-size: 60px; font-weight: 800; margin-bottom: 12px; line-height: 1.1; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .role { font-size: 24px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }
.hero .tag { color: var(--muted); max-width: 600px; margin: 0 auto 36px; font-size: 18px; }
.hero-avatar { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 30px; object-fit: cover; border: 4px solid var(--surface); box-shadow: 0 10px 30px rgba(109,74,255,0.2); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 70px; font-weight: 800; }
section { padding: 80px 0; }
h2 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
h2::after { content: ''; display: block; width: 60px; height: 4px; border-radius: 4px; margin-top: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; transition: 0.4s; }
.card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(109,74,255,0.15); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
.skill-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; }
.skill-bar { height: 10px; background: var(--bg); border-radius: 10px; overflow: hidden; }
.skill-bar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.cert { display: flex; gap: 20px; align-items: center; }
.cert-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
.social-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; justify-content: center; }
.social-icon { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-size: 22px; transition: 0.2s; color: var(--text); }
.social-icon:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-5px); }
footer { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); margin-top: 80px; }
@media (max-width: 768px) { .hero h1 { font-size: 40px; } .hero { padding: 60px 0 40px; } nav { display: none; } }

#adminPanel { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; overflow-y: auto; padding: 20px; }
#adminPanel.on { display: block; }
.admin-content { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: 20px; border: 1px solid var(--line); }
.admin-content label { display: block; margin-top: 15px; font-weight: 600; color: var(--muted); font-size: 14px; }
.admin-content input, .admin-content textarea, .admin-content select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; }
.admin-item { border: 1px solid var(--line); padding: 15px; border-radius: 12px; margin-top: 10px; position: relative; }
.admin-item .del-btn { position: absolute; top: 10px; left: 10px; color: red; cursor: pointer; font-weight: 700; background: none; border: none; font-size: 16px; }
.admin-section-title { font-size: 18px; font-weight: 800; margin-top: 30px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); }
</style>
</head>

        <div class="grid">${D.skills.map(s => `<div class="card"><div class="skill-row"><span>${s.n}</span><span>${s.v}%</span></div><div class="skill-bar"><i style="width:${s.v}%"></i></div></div>`).join('')}</div>

      <section id="projects"><div class="wrap">
        <h2>${isAr?'المشاريع':'Projects'}</h2>

          <div class="card">
            <h3 style="font-size:20px;margin-bottom:4px">${e.role}</h3>
            <p style="color:var(--accent);font-weight:600;margin-bottom:8px">${e.org} · ${e.period}</p>

function toggleLang() {
  document.documentElement.lang = document.documentElement.lang === 'ar' ? 'en' : 'ar';
  document.documentElement.dir = document.documentElement.lang === 'ar' ? 'rtl' : 'ltr';
  render();
}
function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
}
if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');

var taps = 0, tapTimer;
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'FOOTER' || e.target.closest('footer')) {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 1000);
    if (taps >= 5) { taps = 0; openAdmin(); }
  }
});

function closeAdmin() { document.getElementById('adminPanel').classList.remove('on'); }

function renderAdminLists() {
  // Skills
  document.getElementById('admin-skills').innerHTML = D.skills.map((s,i) => `
    <div class="admin-item">
      <button class="del-btn" onclick="delSkill(${i})">✖</button>
      <input placeholder="اسم المهارة" value="${s.n}" oninput="D.skills[${i}].n=this.value">
      <input type="number" placeholder="النسبة" value="${s.v}" oninput="D.skills[${i}].v=+this.value">
    </div>`).join('');
  
  // Projects
  document.getElementById('admin-projects').innerHTML = D.projects.map((p,i) => `
    <div class="admin-item">
      <button class="del-btn" onclick="delProject(${i})">✖</button>
      <input placeholder="العنوان" value="${p.title||''}" oninput="D.projects[${i}].title=this.value">
      <textarea placeholder="الوصف" oninput="D.projects[${i}].desc=this.value" rows="2">${p.desc||''}</textarea>
      <input placeholder="اللينك" value="${p.link||''}" oninput="D.projects[${i}].link=this.value">
      <input placeholder="لينك الصورة" value="${p.img||''}" oninput="D.projects[${i}].img=this.value">
    </div>`).join('');
  
  // Certs
  document.getElementById('admin-certs').innerHTML = D.certs.map((c,i) => `
    <div class="admin-item">
      <button class="del-btn" onclick="delCert(${i})">✖</button>
      <input placeholder="العنوان" value="${c.title||''}" oninput="D.certs[${i}].title=this.value">
      <input placeholder="الجهة" value="${c.issuer||''}" oninput="D.certs[${i}].issuer=this.value">
      <input placeholder="السنة" value="${c.year||''}" oninput="D.certs[${i}].year=this.value">
      <input placeholder="لينك الصورة أو PDF" value="${c.img||''}" oninput="D.certs[${i}].img=this.value">
      <label style="font-size:13px;margin-top:8px">أو ارفع ملف PDF/صورة:</label>
      <input type="file" accept="image/*,application/pdf" onchange="uploadCertFile(event, ${i})">
    </div>`).join('');
  
  // Exp
  document.getElementById('admin-exp').innerHTML = (D.exp||[]).map((e,i) => `
    <div class="admin-item">
      <button class="del-btn" onclick="delExp(${i})">✖</button>
      <input placeholder="الدور" value="${e.role||''}" oninput="D.exp[${i}].role=this.value">
      <input placeholder="الشركة/المنصة" value="${e.org||''}" oninput="D.exp[${i}].org=this.value">

function addSkill() { D.skills.push({n:"",v:50}); renderAdminLists(); }
function delSkill(i) { D.skills.splice(i,1); renderAdminLists(); }
function addProject() { D.projects.push({title:"",desc:"",link:"",img:""}); renderAdminLists(); }
function delProject(i) { D.projects.splice(i,1); renderAdminLists(); }
function addCert() { D.certs.push({title:"",issuer:"",year:"",img:""}); renderAdminLists(); }
function delCert(i) { D.certs.splice(i,1); renderAdminLists(); }
function addExp() { if(!D.exp) D.exp=[]; D.exp.push({role:"",org:"",period:"",desc:""}); renderAdminLists(); }
function delExp(i) { D.exp.splice(i,1); renderAdminLists(); }

async function uploadCertFile(e, i) {
  var file = e.target.files[0];
  if (!file) return;
  
  if (file.type === 'application/pdf') {
    // تحويل PDF لصورة
    try {
      var arrayBuffer = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      var page = await pdf.getPage(1);
      var viewport = page.getViewport({ scale: 2.0 });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      var ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      var dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      D.certs[i].img = dataUrl;
      renderAdminLists();
      alert('✅ تم تحويل الـ PDF لصورة! اضغط حفظ عشان تظهر.');
    } catch (err) {
      alert('⚠️ خطأ في قراءة PDF: ' + err.message);
    }
  } else {
    // صورة عادية
    var reader = new FileReader();
    reader.onload = function(ev) {
      D.certs[i].img = ev.target.result;
      renderAdminLists();
      alert('✅ تم رفع الصورة! اضغط حفظ عشان تظهر.');
    };
    reader.readAsDataURL(file);
  }
}

async function saveData() {
  D.nameAr = document.getElementById('a-name-ar').value;
  D.nameEn = document.getElementById('a-name-en').value;
  D.roleAr = document.getElementById('a-role-ar').value;

  D.tagAr = document.getElementById('a-tag-ar').value;
  D.tagEn = document.getElementById('a-tag-en').value;
  D.image = document.getElementById('a-image').value;
  D.email = document.getElementById('a-email').value;
  D.phone = document.getElementById('a-phone').value;
  D.whatsapp = document.getElementById('a-whatsapp').value;
  D.github = document.getElementById('a-github').value;
  D.linkedin = document.getElementById('a-linkedin').value;
  
  document.getElementById('admin-status').textContent = 'جاري الحفظ في سوبابيز...';
  try {
    await saveToSupabase(D);
    localStorage.setItem('portfolioData', JSON.stringify(D));
    document.getElementById('admin-status').textContent = '✅ تم الحفظ! سيظهر لكل الناس.';
    setTimeout(() => { closeAdmin(); render(); }, 1500);
  } catch (e) {
    document.getElementById('admin-status').textContent = '⚠️ فشل: ' + e.message;
  }
}

loadFromSupabase().then(() => render());
